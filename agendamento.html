<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/global.css">
    <title>Vitta | Agendamento</title>
</head>
<body>
    <header>
        <img src="/img/logo.png" alt="Logo Vitta" onclick="voltarHome()">
        <nav>
                <a href="index.html#servicos">Serviços</a>
                <a href="index.html#especialidades">Especialidades</a>
                <a href="agendamento.html">Agendamento</a>
                <a href="contato.html">Contato</a>
        </nav>
    </header>
    <main>
        <h2 class="titulo-agendamento">Preencha o formulário abaixo</h2>
        <form onsubmit="return confirmarAgendamento()">
            <input type="text" name="" id="nomePaciente" placeholder="Nome completo" required> <br>
            <input type="tel" name="" id="" placeholder="Telefone" required> <br>
            <input type="email" name="" id="" placeholder="E-mail" required> <br>
            <select name="especialidade" id="especialidade" required>
                <option value="">Selecione a especialidade</option>
                <option value="Cardiologia">Cardiologia</option>
                <option value="Cirurgia-Pediátrica">Cirurgia Pediátrica</option>
                <option value="Alergologia">Alergologia</option>
                <option value="Imunologia-Pediátrica">Imunologia Pediátrica</option>
                <option value="Pneumologia">Pneumologia</option>
                <option value="Radiologia-Pediátrica">Radiologia Pediátrica</option>
                <option value="Nutrição-Comportamental">Nutrição Comportamental</option>
                <option value="Ultrassonografia">Ultrassonografia</option>
            </select> <br>
            <input type="text" name="" id="" placeholder="Motivo da consulta" required> <br>
            <input type="date" name="" id="" required>
            <button class="botao-enviar-agendamento">Enviar</button>
        </form>
        
        
    </main>

    <footer>
        <div class="logo-footer">
            <img src="img/logo.png" alt="Logo Vitta" onclick="voltarHome()">
            <p>Cuidando com carinho desde o primeiro suspiro</p>
        </div>

        <div class="link-footer">
            <a href="index.html#servicos">Serviços</a>
            <a href="index.html#especialidades">Especialidades</a>
            <a href="agendamento.html">Agendamento</a>
            <a href="contato.html">Contato</a>
        </div>

        <div class="localizacao-footer">
            <h3>Onde estamos?</h3>
            <p>R. Bernardo Ferreira da Cruz, 52 - São Pedro (Venda Nova), Belo Horizonte - MG, 31610-120</p>
            <p id="tel-footer">(31) 9999-9999</p>
        </div>
    </footer>

     <div vw class="enabled">
        <div vw-access-button class="active"></div>

        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

    <script src="script.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
</body>
</html>
